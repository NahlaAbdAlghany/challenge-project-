on:
  push:
    branches:
    - phase-two

jobs:
  # ============================================
  # detect-changes LAYER
  # ============================================
  detect-changes:
    runs-on: ubuntu-24.04
    outputs:
       vote: ${{ steps.filter.outputs.vote }}
       result: ${{ steps.filter.outputs.result }}
       worker: ${{ steps.filter.outputs.worker }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v2
      id: filter
      with:
        filters: |
          vote: vote/**
          result: result/**
          worker: worker/**

    - name: Generate tag
      id: generate-tag
      run: |
          # Get branch name and sanitize it
          BRANCH_NAME="${{ github.ref_name }}"
          CLEAN_BRANCH=$(echo "$BRANCH_NAME" | sed 's/\//-/g' | sed 's/_/-/g')
          
          # Get build number
          BUILD_ID="${{ github.run_number }}"
          
          # Create tag: branch-buildid
          TAG="${CLEAN_BRANCH}-${BUILD_ID}"
          
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "clean_branch=${CLEAN_BRANCH}" >> $GITHUB_OUTPUT
          echo "✓ Generated tag: ${TAG}"
 # ============================================
  # BUILD LAYER - Vote Service
  # ============================================
  Build-vote-service:
    if: needs.detect-changes.outputs.vote == 'true'
    needs: detect-changes
    runs-on: ubuntu-24.04


    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build vote image
        run: |
          TAG="${{ needs.detect-changes.outputs.tag }}"
          
          echo "Building vote image with tag: ${TAG}"
          docker build -t ${{ env.DOCKERHUB_USERNAME }}/vote:${TAG} ./vote
          
          # Tag as latest only for main branch
          if [ "${{ github.ref_name }}" == "main" ]; then
            docker tag ${{ env.DOCKERHUB_USERNAME }}/vote:${TAG} ${{ env.DOCKERHUB_USERNAME }}/vote:latest
            echo "✓ Also tagged as latest (main branch)"
          fi
      
      - name: Save image
        run: |
          TAG="${{ needs.detect-changes.outputs.tag }}"
          docker save ${{ env.DOCKERHUB_USERNAME }}/vote:${TAG} | gzip > vote-image.tar.gz
      
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: vote-image
          path: vote-image.tar.gz
          retention-days: 1

  # ============================================
  # BUILD LAYER - Result Service
  # ============================================
  build-result:
    needs: detect-changes
    if: needs.detect-changes.outputs.result == 'true'
    runs-on: ubuntu-24.04
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build result image
        run: |
          TAG="${{ needs.detect-changes.outputs.tag }}"
          
          echo "Building result image with tag: ${TAG}"
          docker build -t ${{ env.DOCKERHUB_USERNAME }}/result:${TAG} ./result
          
          if [ "${{ github.ref_name }}" == "main" ]; then
            docker tag ${{ env.DOCKERHUB_USERNAME }}/result:${TAG} ${{ env.DOCKERHUB_USERNAME }}/result:latest
            echo "✓ Also tagged as latest (main branch)"
          fi
      
      - name: Save image
        run: |
          TAG="${{ needs.detect-changes.outputs.tag }}"
          docker save ${{ env.DOCKERHUB_USERNAME }}/result:${TAG} | gzip > result-image.tar.gz
      
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: result-image
          path: result-image.tar.gz
          retention-days: 1

  # ============================================
  # BUILD LAYER - Worker Service
  # ============================================
  build-worker:
    needs: detect-changes
    if: needs.detect-changes.outputs.worker == 'true'
    runs-on: ubuntu-24.04
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build worker image
        run: |
          TAG="${{ needs.detect-changes.outputs.tag }}"
          
          echo "Building worker image with tag: ${TAG}"
          docker build -t ${{ env.DOCKERHUB_USERNAME }}/worker:${TAG} ./worker
          
          if [ "${{ github.ref_name }}" == "main" ]; then
            docker tag ${{ env.DOCKERHUB_USERNAME }}/worker:${TAG} ${{ env.DOCKERHUB_USERNAME }}/worker:latest
            echo "✓ Also tagged as latest (main branch)"
          fi
      
      - name: Save image
        run: |
          TAG="${{ needs.detect-changes.outputs.tag }}"
          docker save ${{ env.DOCKERHUB_USERNAME }}/worker:${TAG} | gzip > worker-image.tar.gz
      
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-image
          path: worker-image.tar.gz
          retention-days: 1
    

# ============================================
  # DEPLOY LAYER - Push to Docker Hub
  # ============================================
  push-images:
    needs: [detect-changes]
    if: github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-24.04
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./images
      
      - name: Load and push images
        run: |
          TAG="${{ needs.detect-changes.outputs.tag }}"
          
          echo "Pushing images to Docker Hub with tag: ${TAG}"
          echo ""
          
          # Load and push vote
          if [ -f ./images/vote-image/vote-image.tar.gz ]; then
            docker load < ./images/vote-image/vote-image.tar.gz
            docker push ${{ env.DOCKERHUB_USERNAME }}/vote:${TAG}
            docker push ${{ env.DOCKERHUB_USERNAME }}/vote:latest
            echo "✓ Pushed vote:${TAG} and vote:latest"
          fi
          
          # Load and push result
          if [ -f ./images/result-image/result-image.tar.gz ]; then
            docker load < ./images/result-image/result-image.tar.gz
            docker push ${{ env.DOCKERHUB_USERNAME }}/result:${TAG}
            docker push ${{ env.DOCKERHUB_USERNAME }}/result:latest
            echo "✓ Pushed result:${TAG} and result:latest"
          fi
          
          # Load and push worker
          if [ -f ./images/worker-image/worker-image.tar.gz ]; then
            docker load < ./images/worker-image/worker-image.tar.gz
            docker push ${{ env.DOCKERHUB_USERNAME }}/worker:${TAG}
            docker push ${{ env.DOCKERHUB_USERNAME }}/worker:latest
            echo "✓ Pushed worker:${TAG} and worker:latest"
          fi
       
          
          echo ""
          echo "✓ All images pushed to Docker Hub successfully!"

  # ============================================
  # DEPLOY LAYER - Deploy to Kubernetes
  # ============================================
  deploy-to-kubernetes:
    needs: [detect-changes, push-images]
    if: github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-24.04
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version
      
          
      - name: Update Kustomize with new image tags
        run: |
          TAG="${{ needs.detect-changes.outputs.tag }}"
          
          cd k8s/overlays/production
          
          echo "Updating images to tag: ${TAG}"
          
          # Update image tags in kustomization.yaml
          kustomize edit set image \
            vote=${{ env.DOCKERHUB_USERNAME }}/vote:${TAG} \
            result=${{ env.DOCKERHUB_USERNAME }}/result:${TAG} \
            worker=${{ env.DOCKERHUB_USERNAME }}/worker:${TAG}
          
          echo "Updated kustomization.yaml:"
          cat kustomization.yaml
  