apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: voting-appset
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      elements:
      - cluster: in-cluster
        url: https://kubernetes.default.svc
        namespace: voting-dev
        appName: vote-app
        path: vote/k8s/overlays/dev

      - cluster: in-cluster
        url: https://kubernetes.default.svc
        namespace: voting-dev
        appName: result-app
        path: result/k8s/overlays/dev

      - cluster: in-cluster
        url: https://kubernetes.default.svc
        namespace: voting-dev
        appName: worker-app
        path: worker/k8s/overlays/dev
  template:
    metadata:
      name: "voting-{{.appName}}"
    spec:
      project: default
      source:
        repoURL: 'https://github.com/NahlaAbdAlghany/voting-app.git'
        targetRevision: phase-two
        path: '{{.path}}'
      destination:
        server: '{{.url}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
        - CreateNamespace=true