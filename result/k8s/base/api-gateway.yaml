apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: resulting-gateway
spec:
  gatewayClassName: istio
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: result
spec:
  parentRefs:
  - name: resulting-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: result
      port: 8081

---
